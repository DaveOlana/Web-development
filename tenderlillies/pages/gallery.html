<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Gallery | Tenderlillies School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#0A1F44',
                            accent: '#2563EB',
                            background: '#F9FAFB',
                            text: '#111827'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        heading: ['Playfair Display', 'Georgia', 'serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, .font-heading { font-family: 'Playfair Display', serif; }
        html { scroll-behavior: smooth; }
    </style>
</head>

<body class="bg-brand-background text-brand-text antialiased overflow-x-hidden flex flex-col min-h-screen selection:bg-brand-accent selection:text-white">
    <div id="navbar-container"></div>
    <div id="notice-container"></div>

    <!-- Inner Page Header -->
    <div class="pt-40 pb-20 bg-brand-primary relative overflow-hidden border-b border-white/10">
        <div
            class="absolute inset-0 opacity-20 bg-[url('/images/gallery/anna-amelina-BGvLIb1wriA-unsplash.jpg')] bg-cover bg-center">
        </div>
        <div class="absolute inset-0 bg-gradient-to-t from-brand-primary to-transparent z-10"></div>
        <div class="max-w-7xl mx-auto px-4 md:px-12 relative z-20 text-center">
            <span class="text-white/60 font-medium tracking-widest uppercase text-xs mb-4 block">Visual
                Experience</span>
            <h1 class="text-4xl md:text-6xl font-heading font-bold text-white mb-6">Campus Gallery</h1>
            <div class="w-16 h-1 bg-brand-accent mx-auto rounded-full"></div>
        </div>
    </div>

    <main class="flex-grow bg-brand-background pt-16 pb-24 px-4 md:px-12">
        <div class="max-w-7xl mx-auto">
            <div class="text-center max-w-2xl mx-auto mb-16">
                <p class="text-gray-600 text-lg leading-relaxed">A visual glimpse into the daily premium experience at
                    Tenderlillies. Explore our state-of-the-art facilities and vibrant student activities.</p>
            </div>

            <!-- Gallery Engine initialized by ui.js -->
            <div id="gallery-container" class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Using assets moved to /images/gallery -->
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/and-i-was-a-boy-from-school.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/anna-amelina-BGvLIb1wriA-unsplash.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/hand-reaching-up-with-soccer-ball.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/husniati-salma-cGjGtaRu_14-unsplash.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/little-boy-ready-for-school-looking-up.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/modern-family-photo.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/oli2020-school-4431068_1920.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
                <div class="aspect-square rounded-xl overflow-hidden shadow-sm bg-gray-200 border border-gray-100"><img
                        src="/images/gallery/picha-hd-QP1liV_XXE0-unsplash.jpg" alt="Gallery Image"
                        class="w-full h-full object-cover"></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="/scripts/ui.js"></script>
    <script src="/scripts/notice.js"></script>
</body>

</html>
