<!-- Deep CSS Animation Logic -->
<style>
    @keyframes eliteZoom {
        from {
            transform: scale(1);
        }

        to {
            transform: scale(1.1);
        }
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes scrollLine {
        0% {
            transform: translateY(-100%);
        }

        50% {
            transform: translateY(0);
        }

        100% {
            transform: translateY(100%);
        }
    }
</style>
