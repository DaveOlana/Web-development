<div id="notice-modal"
    class="fixed inset-0 z-[60] hidden bg-brand-primary/95 backdrop-blur-md flex items-center justify-center p-4 transition-opacity duration-500"
    role="dialog" aria-modal="true">

    <div class="bg-transparent overflow-visible max-w-2xl w-full relative transform scale-95 opacity-0 transition-all duration-500 flex flex-col items-center"
        id="notice-modal-content">

        <!-- Elegant Floating Close Button -->
        <button id="close-notice"
            class="absolute -top-4 -right-4 md:top-0 md:-right-12 bg-white/10 hover:bg-white/20 backdrop-blur-md text-white rounded-full p-2 transition-transform hover:scale-110 focus:outline-none z-10 border border-white/10"
            aria-label="Close Notice">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- Dynamic Image Container -->
        <div class="relative w-full rounded-2xl shadow-2xl overflow-hidden border border-white/5 ring-1 ring-white/10"
            id="notice-image-wrapper">
            <!-- Image injected via JS as a high-fidelity informative asset -->
            <img id="notice-hero-image" src="" alt="Latest Announcement"
                class="w-full h-auto object-contain max-h-[80vh] bg-brand-primary/50">

            <!-- Subtle dismissal trigger below image -->
            <div
                class="absolute bottom-0 w-full p-4 bg-gradient-to-t from-black/80 to-transparent flex justify-between items-center">
                <span id="notice-date" class="text-xs font-medium text-white/70 uppercase tracking-widest pl-2"></span>
                <button id="dismiss-notice"
                    class="text-xs text-white/50 hover:text-white uppercase tracking-widest transition-colors pb-1 border-b border-transparent hover:border-white">
                    Dismiss
                </button>
            </div>
        </div>

    </div>
</div>
