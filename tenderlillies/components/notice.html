<div id="notice-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-blue-950/80 backdrop-blur-sm p-4">

    <!-- The Content Card -->
    <div id="notice-modal-content"
        class="relative w-full max-w-3xl bg-white rounded-xl shadow-2xl overflow-hidden min-h-[400px] flex flex-col">

        <!-- The Close Button -->
        <button id="close-notice"
            class="absolute top-4 right-4 bg-black/50 text-white rounded-full p-2 hover:bg-black/70 transition-colors z-10"
            aria-label="Close Notice">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>

        <!-- The Image Tag -->
        <img id="notice-hero-image" src="" alt="Latest Notice"
            class="w-full h-auto max-h-[70vh] object-cover bg-gray-100">

    </div>
</div>
